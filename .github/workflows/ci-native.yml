name: ci-native

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: python3 scripts/validate_scaffold.py
      - run: zig fmt --check build.zig src/*.zig
      - run: zig build
      - run: zig build test
